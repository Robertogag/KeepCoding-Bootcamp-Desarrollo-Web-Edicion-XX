services:
  postgres:
    image: postgres:16
    container_name: bookshop_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: BookShop
    ports:
      - '5432:5432'
    volumes:
      - bookshop_postgres_data:/var/lib/postgresql/data
    restart: always

  maildev:
    image: maildev/maildev
    container_name: bookshop_maildev
    ports:
      - '1080:1080'
      - '1025:1025'
    restart: always

volumes:
  bookshop_postgres_data:
