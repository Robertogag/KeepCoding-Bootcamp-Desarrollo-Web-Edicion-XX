# Cloud SQL externo: archivo independiente, no combinar con otros Compose.
# El perfil demo activa el simulador Modbus; los servicios normales usan los hosts configurados.
name: oee-live-cloud
x-backend:
  build: ./backend
  image: oee-live-backend:production
  init: true
  logging: &id001
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  environment: &id002
    ENVIRONMENT: production
    DATABASE_URL: ${CLOUD_SQL_DATABASE_URL:?Configure CLOUD_SQL_DATABASE_URL}
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
    FRONTEND_URL: https://${DOMAIN:?Configure DOMAIN}
    PUBLIC_API_URL: https://${DOMAIN:?Configure DOMAIN}/api/v1
    UPLOAD_DIR: /data/uploads
    SMTP_HOST: ${SMTP_HOST:?Configure SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:?Configure SMTP_USER}
    SMTP_PASSWORD: ${SMTP_PASSWORD:?Configure SMTP_PASSWORD}
    SMTP_FROM: ${SMTP_FROM:?Configure SMTP_FROM}
    SMTP_STARTTLS: 'true'
    ACCESS_TOKEN_MINUTES: 15
    REFRESH_TOKEN_DAYS: 14
services:
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    restart: unless-stopped
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    image: oee-live-backend:production
    init: true
    logging: *id001
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${CLOUD_SQL_MIGRATION_DATABASE_URL:?Configure CLOUD_SQL_MIGRATION_DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      FRONTEND_URL: https://${DOMAIN:?Configure DOMAIN}
      PUBLIC_API_URL: https://${DOMAIN:?Configure DOMAIN}/api/v1
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:?Configure SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Configure SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Configure SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Configure SMTP_FROM}
      SMTP_STARTTLS: 'true'
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 14
    command:
    - python
    - -m
    - alembic
    - upgrade
    - head
  api:
    build: ./backend
    image: oee-live-backend:production
    init: true
    logging: *id001
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${CLOUD_SQL_DATABASE_URL:?Configure CLOUD_SQL_DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      FRONTEND_URL: https://${DOMAIN:?Configure DOMAIN}
      PUBLIC_API_URL: https://${DOMAIN:?Configure DOMAIN}/api/v1
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:?Configure SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Configure SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Configure SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Configure SMTP_FROM}
      SMTP_STARTTLS: 'true'
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 14
      SIMULATOR_CONFIG: /app/config/machines.yaml
    restart: unless-stopped
    volumes:
    - uploads:/data/uploads
    - ./simulator/machines.yaml:/app/config/machines.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  simulator:
    build: ./simulator
    init: true
    restart: unless-stopped
    environment:
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
    profiles:
    - demo
  collector:
    build: ./backend
    image: oee-live-backend:production
    init: true
    logging: *id001
    environment: *id002
    command:
    - python
    - -m
    - app.collector
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - app.collector.health
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?Configure DOMAIN}/api/v1
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN:?Configure DOMAIN}/ws
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?Configure DOMAIN}
        NEXT_PUBLIC_API_MOCKING: 'false'
    init: true
    restart: unless-stopped
    environment:
      API_URL_INTERNAL: http://api:8000/api/v1
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Configure DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL}
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
volumes:
  redis-data: null
  uploads: null
  caddy-data: null
  caddy-config: null
