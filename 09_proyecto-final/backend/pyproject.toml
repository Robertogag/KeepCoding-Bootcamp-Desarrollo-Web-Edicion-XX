[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oee-live-backend"
version = "0.1.0"
description = "API y colector de producción OEE Live"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "redis>=5.2,<8",
  "pymodbus==3.11.4",
  "Pillow>=11,<13",
  "aiosmtplib>=3.0,<6",
  "Jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  "aiosqlite>=0.20,<1",
  "fakeredis>=2,<3",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
