# All addresses, process values and non-time units below are simulator conventions.
# MES supplies the canonical names, not this register map or physical units.
map_version: injection-demo-v1
process_variables:
  - {code: filling_time_s, name: "DEMO - Tiempo de llenado", unit: s, address: 9, cycle_fraction: 0.08}
  - {code: dose_time_s, name: "DEMO - Tiempo de dosificacion", unit: s, address: 11, cycle_fraction: 0.18}
  - {code: min_cushion_position, name: "DEMO - Colchon minimo", unit: mm, address: 13, baseline: 4.5}
  - {code: vp_switchover_position, name: "DEMO - Posicion de transferencia V/P", unit: mm, address: 15, baseline: 12.0}
  - {code: peak_injection_pressure, name: "DEMO - Presion pico de inyeccion", unit: bar, address: 17, baseline: 850.0}
  - {code: cooling_time_s, name: "DEMO - Tiempo de enfriamiento", unit: s, address: 19, cycle_fraction: 0.50}
  - {code: melt_temperature_c, name: "DEMO - Temperatura de masa", unit: "°C", address: 21, baseline: 225.0}
  - {code: mold_temperature_c, name: "DEMO - Temperatura de molde", unit: "°C", address: 23, baseline: 45.0}
  - {code: holding_pressure, name: "DEMO - Presion de sostenimiento", unit: bar, address: 25, baseline: 450.0}
  - {code: clamp_force, name: "DEMO - Fuerza de cierre", unit: kN, address: 27, baseline: 1800.0}
  - {code: shot_count, name: "DEMO - Disparos absolutos", unit: shots, address: 29, data_type: uint32}
  - {code: active_cavities, name: "DEMO - Cavidades activas", unit: count, address: 31, data_type: uint16}
