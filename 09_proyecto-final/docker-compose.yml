name: oee-live

x-backend: &backend
  build: ./backend
  image: oee-live-backend:local
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment: &backend-environment
    ENVIRONMENT: development
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oee}:${POSTGRES_PASSWORD:-oee}@postgres:5432/${POSTGRES_DB:-oee}
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-development-only-change-before-deploying-32-chars}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
    UPLOAD_DIR: /data/uploads
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    SMTP_FROM: ${SMTP_FROM:-OEE Live <noreply@localhost>}
    SMTP_STARTTLS: "false"
    ACCESS_TOKEN_MINUTES: 15
    REFRESH_TOKEN_DAYS: 14

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oee}
      POSTGRES_DB: ${POSTGRES_DB:-oee}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"

  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-environment
      SIMULATOR_CONFIG: /app/config/machines.yaml
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
      - ./simulator/machines.yaml:/app/config/machines.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  simulator:
    build: ./simulator
    init: true
    environment:
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
    ports:
      - "127.0.0.1:${SIMULATOR_MODBUS_PORT:-5020}:5020"
      - "127.0.0.1:${SIMULATOR_HTTP_PORT:-8100}:8100"

  collector:
    <<: *backend
    command: ["python", "-m", "app.collector"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.collector.health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_MOCKING: "false"
    init: true
    environment:
      API_URL_INTERNAL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
